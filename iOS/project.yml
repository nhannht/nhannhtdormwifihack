# The iOS app. Generate the Xcode project with `xcodegen generate` in this
# directory, then open `nhannhtdormwifihack-ios.xcodeproj`.
#
# The project is generated rather than committed because it is entirely
# derivable from this file, and a committed one is a merge conflict waiting to
# happen for no benefit.
name: nhannhtdormwifihack-ios

options:
  bundleIdPrefix: vn.io.nhannht
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  nhannhtdormwifihackKit:
    path: ..

targets:
  DormWiFi:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dorm WiFi
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required. Everything this app does is a connection to the router on
        # the local network, and iOS refuses those without a stated reason.
        NSLocalNetworkUsageDescription: >-
          Dorm WiFi talks to the hotspot's router to sign you in and to ask how
          long your session has left. It sends nothing anywhere else.
        NSAppTransportSecurity:
          # A captive portal is plain HTTP by nature. The router serves its
          # login page over HTTP on a bare IP address, and that page names the
          # advert portal to use, so the portal's address is not known until the
          # router says it. The two networks here name different ones, and a
          # third would name a third, so there is no list of hosts that could be
          # written down in advance and no scheme that can be insisted on.
          #
          # NSAllowsLocalNetworking must NOT be added alongside this. On iOS 10
          # and later the system ignores NSAllowsArbitraryLoads whenever
          # NSAllowsLocalNetworking is also present, so having both permits the
          # router and blocks the portal. That is not a guess: with both keys
          # set, this app reached 192.168.200.1 and then failed step 2 with
          # "App Transport Security policy requires the use of a secure
          # connection" on 2026-09-01.
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/DormWiFi.entitlements
      properties:
        # The app does not tunnel anything itself. It needs this to create and
        # start the tunnel configuration that the extension runs inside.
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.vn.io.nhannht.dormwifihack
    dependencies:
      - package: nhannhtdormwifihackKit
        product: nhannhtdormwifihackKit
      - target: DormWiFiTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.io.nhannht.dormwifihack
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V3P5U9Z68M
        ENABLE_USER_SCRIPT_SANDBOXING: true

  # The tunnel. A separate process, which is the entire point: iOS suspends the
  # app a few seconds after it leaves the screen and does not suspend this.
  DormWiFiTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
    dependencies:
      - package: nhannhtdormwifihackKit
        product: nhannhtdormwifihackKit
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Dorm WiFi Tunnel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
        # Both of these have to be repeated here and cannot be inherited. This
        # is a separate bundle with its own Info.plist, and from here on it is
        # this process, not the app, that talks to the router and the portal.
        NSLocalNetworkUsageDescription: >-
          Dorm WiFi talks to the hotspot's router to sign you in and to ask how
          long your session has left. It sends nothing anywhere else.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Tunnel/DormWiFiTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.vn.io.nhannht.dormwifihack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.io.nhannht.dormwifihack.tunnel
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V3P5U9Z68M

